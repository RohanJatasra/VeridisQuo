[tool.poetry]
name = "VeridisQuo"
version = "0.1.0"
description = "Neural network specialised in deepfake detection, notably using EfficientNet and Gradcam."
authors = [
    "Clement Barriere <clementbarriere64@gmail.com>",
    "Theo Castillo <theocastillo@yahoo.com>"
]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.3.2,<3.0.0"
Pillow = ">=10.0.0,<11.0.0"
opencv-python = ">=4.8.0,<5.0.0"
pandas = ">=2.3.3,<3.0.0"
tqdm = ">=4.66.0,<5.0.0"
ultralytics = ">=8.0.0,<9.0.0"
setuptools = "<81.0.0"
torch = {version = "^2.5.1", source = "pytorch-cpu"}
torchvision = {version = "^0.20.1", source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
pytest-cov = ">=6.0.0,<7.0.0"
pytest-xdist = ">=3.0.0,<4.0.0"
pytest-mock = ">=3.14.0,<4.0.0"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# PyTorch is now in main dependencies with CPU source
# Keep this group for future GPU-specific dependencies if needed

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
