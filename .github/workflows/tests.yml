name: Tests

on:
  push:
    branches: [ main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: thekevjames/poetry:1.8-python3.12
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Load cached dependencies
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies (CPU-only)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          # Install all dependencies except ML group (PyTorch)
          poetry install --without ml --no-interaction
          # Install CPU-only version of PyTorch for YOLO
          poetry run pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        env:
          PIP_NO_CACHE_DIR: "0"

      - name: Install dependencies (from cache)
        if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
        run: |
          poetry install --without ml --no-interaction
          poetry run pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short
        env:
          # Désactiver CUDA pour les tests CI (utiliser CPU seulement)
          CUDA_VISIBLE_DEVICES: ""

