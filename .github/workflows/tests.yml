name: Tests

on:
  push:
    branches: [ main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/poetry
          key: poetry-binary-${{ runner.os }}-1.8.0

      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        run: |
          pip install poetry==1.8.0
          poetry config virtualenvs.create false

      - name: Configure Poetry
        if: steps.cached-poetry.outputs.cache-hit == 'true'
        run: poetry config virtualenvs.create false

      - name: Cache dependencies
        id: cached-deps
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/python3.12/site-packages
            /usr/local/bin
          key: deps-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies (CPU-only)
        if: steps.cached-deps.outputs.cache-hit != 'true'
        run: |
          # Poetry will use CPU-only PyTorch from pytorch-cpu source defined in pyproject.toml
          poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short
        env:
          # Désactiver CUDA pour les tests CI (utiliser CPU seulement)
          CUDA_VISIBLE_DEVICES: ""
