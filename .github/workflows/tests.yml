name: Tests

on:
  push:
    branches: [ main, spatial, preprocess ]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: ${{ runner.os }}-poetry-

    - name: Check Poetry Lock
      run: poetry lock --check || poetry lock

      - name: Install dependencies
        run: poetry install --only main,dev --no-interaction

    - name: Run tests
      run: poetry run pytest tests/ -v --tb=short
      env:
        # Désactiver CUDA pour les tests CI (utiliser CPU seulement)
        CUDA_VISIBLE_DEVICES: ""

